version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    commit-message:
      prefix: upgrade
    groups:
      github-actions:
        patterns:
          - '*'

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    commit-message:
      prefix: upgrade
    groups:
      npm-minor-and-patch:
        update-types:
          - minor
          - patch

  # 解決する PHP の版は composer.json の config.platform.php で最小の版に固定している
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    commit-message:
      prefix: upgrade
    groups:
      composer-minor-and-patch:
        update-types:
          - minor
          - patch
