name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '7.4'
          coverage: none
          tools: composer
      - run: npm ci
      - run: bash tests/check-version.sh
      - run: npm run lint:js
      - run: npm run test:js
      - run: npm run build
      - run: composer install --no-interaction --no-progress
      - run: vendor/bin/phpcs

  phpunit:
    name: phpunit (WP ${{ matrix.wp }} / PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # 本体のヘッダーに書いた最小の版
          - wp: '6.7'
            core: 'WordPress/WordPress#6.7'
            php: '7.4'
          - wp: latest
            core: ''
            php: '8.5'
    env:
      WP_ENV_CORE: ${{ matrix.core }}
      WP_ENV_PHP_VERSION: ${{ matrix.php }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # ブロックの登録に build/ が要る。翻訳の確かめもビルド後の JS を読む。
      - run: npm run build
      - run: npm run env start
      - run: npm run composer install -- --no-interaction --no-progress
      - run: npm run test:php
      - run: npm run test:php:multisite
      - run: npm run i18n:check

  plugin-zip:
    name: plugin zip and Plugin Check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run plugin-zip
      - name: zip に開発用のファイルが入っていないことを確かめる
        run: |
          unzip -Z1 eventwatch.zip | tee zip-files.txt
          if grep -E '(^|/)(node_modules|tests|src|vendor|docs|\.github)/|\.map$|(^|/)(composer\.(json|lock)|package(-lock)?\.json|phpcs\.xml\.dist|phpunit\.xml\.dist|\.wp-env\.json)$' zip-files.txt; then
            echo 'The plugin zip contains development files.' >&2
            exit 1
          fi
      - name: zip を展開する
        run: unzip -q eventwatch.zip -d "$RUNNER_TEMP/plugin"
      - uses: WordPress/plugin-check-action@10857da14b6c2246d15402b3e69f777edcf8c12e # v1.1.9
        with:
          build-dir: ${{ runner.temp }}/plugin/eventwatch
          slug: eventwatch
          categories: plugin_repo
